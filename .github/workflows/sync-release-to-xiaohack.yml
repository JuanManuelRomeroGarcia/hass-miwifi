name: Sync release to XiaoHack web

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to sync
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to XiaoHack
        env:
          WEBHOOK_URL: ${{ secrets.XIAOHACK_RELEASE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.XIAOHACK_RELEASE_WEBHOOK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DRAFT: ${{ github.event.release.draft }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          release = {}
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              repository = os.environ["REPOSITORY"]
              tag_name = urllib.parse.quote(os.environ["TAG_NAME"], safe="")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/releases/tags/{tag_name}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "User-Agent": "miwifi-release-sync",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)

          payload = {
              "repository": os.environ["REPOSITORY"],
              "tag_name": os.environ["TAG_NAME"],
              "name": release.get("name", os.environ.get("RELEASE_NAME", "")),
              "body_en": release.get("body", os.environ.get("RELEASE_BODY", "")),
              "html_url": release.get("html_url", os.environ.get("RELEASE_URL", "")),
              "published_at": release.get("published_at", os.environ.get("PUBLISHED_AT", "")),
              "prerelease": release.get("prerelease", os.environ.get("PRERELEASE", "").lower() == "true"),
              "draft": release.get("draft", os.environ.get("DRAFT", "").lower() == "true"),
          }

          data = json.dumps(payload).encode("utf-8")

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "X-Webhook-Token": os.environ["WEBHOOK_TOKEN"],
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  print(f"HTTP {resp.status}")
                  print(body)
                  if resp.status >= 400:
                      sys.exit(1)
          except Exception as e:
              print(f"Webhook call failed: {e}")
              sys.exit(1)
          PY
